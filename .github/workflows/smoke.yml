# The offline smoke gate — every PR and every push to main runs the whole
# deterministic suite, so a merge can never again silently break a contract
# the way the grit /1 bound (#183/#187) and the honest-ages wording (#186)
# did: both merged red and were found days later by hand. Live suites
# (*-live, federated) stay manual — they need beaches and secrets; this gate
# is everything that proves itself from the repo alone.
name: smoke
on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: Build (tsc)
        run: npm run build
      # The beach package, for the smokes that run against its real handler on a
      # scratch folder (smoke:colour; smoke:signin's third part): one checkout, one
      # install, no beach on the network.
      - uses: actions/checkout@v4
        with:
          repository: pscale-commons/pscale-beach
          path: pscale-beach
      - run: npm install --prefix pscale-beach
      - name: Offline smoke suite
        env:
          BEACH_DIR: ${{ github.workspace }}/pscale-beach
        run: |
          set -u
          FAILED=""
          for s in parser unit floor dots sentinel session wellknown wire-bsp \
                   read-gate pool-engage reference-table networking gray gray-guard group genus play-split \
                   author-door room-fold stream-born-locked stream-map thread \
                   grain-address grain-case grit-tree temporal temporal-envelope human-time wellformed compile compound thread-test proposal-test envelope gateway key-guard seal-price signin colour; do
            echo "── smoke:$s ──"
            if ! npm run --silent "smoke:$s"; then FAILED="$FAILED $s"; fi
          done
          if [ -n "$FAILED" ]; then
            echo "FAILED suites:$FAILED"
            exit 1
          fi
